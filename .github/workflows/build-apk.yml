name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Use Permanent Debug Keystore
      run: cp keystore/debug.keystore debug.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Report Failure in Release Body
      if: failure()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Build Failed Log"
        body_path: build.log
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Release Latest APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "BoostNet Donor APK (Latest)"
        body: |
          ### BoostNet Donor Node v1.0
          - Dynamic SIM Carrier Detection (Airtel, Jio, Vi, BSNL, MTNL).
          - Dynamic 5G NSA (Non-Standalone) detection for Airtel EN-DC networks.
          - Dynamic Device Model Detection (Motorola moto g45 5G, Pixel, Samsung, etc.).
          - Unified permanent static debug keystore (clean updates without signature conflicts).
        files: app/build/outputs/apk/debug/app-debug.apk
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
